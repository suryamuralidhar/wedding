<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Gallery</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    button {
      display: block;
      width: 220px;
      margin: 15px auto;
      padding: 15px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="container">
    <button onclick="openUpload()">Upload Photos</button>
    <button onclick="openView()">View Gallery</button>
  </div>

  <script>
    function openUpload() {
      window.location.href = "https://photos.app.goo.gl/4RHgnPWtVpb6nA9h7";
    }

    function openView() {
      window.location.href = "https://photos.app.goo.gl/4RHgnPWtVpb6nA9h7";
    }
  </script>

</body>
</html>
